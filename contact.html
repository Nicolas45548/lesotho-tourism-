<html lang="en">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>

<nav class="navbar navbar-expand-lg navbar-dark" style="background:#123b2a;">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">Lesotho Tourism</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
<li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
<li class="nav-item"><a class="nav-link" href="accommodation.html">Accommodation</a></li>
<li class="nav-item"><a class="nav-link" href="activities.html">Activities</a></li>
<li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
<li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
</ul>
<button class="btn btn-warning ms-lg-3" onclick="changeMode()">Dark/Light</button>
</div>
</div>
</nav>

</header>
<main>

<section class="container py-5">
<h1 class="section-title">Contact & Booking</h1>
<div class="row g-5">
<div class="col-lg-6">
<h2 class="h4">Booking Form</h2>
<form onsubmit="return validateBooking()">
<label class="form-label">Full Name *</label>
<input id="name" type="text" class="form-control mb-3" required>

<label class="form-label">Email *</label>
<input id="email" type="email" class="form-control mb-3" required>

<label class="form-label">Phone</label>
<input id="phone" type="tel" class="form-control mb-3">

<label class="form-label">Travel Date</label>
<input type="date" class="form-control mb-3">

<label class="form-label">Number of People *</label>
<input id="people" type="number" min="1" class="form-control mb-3" required>

<label class="form-label">Destination</label>
<select class="form-select mb-3">
<option>Maletsunyane Falls</option>
<option>Katse Dam</option>
<option>Thaba Bosiu</option>
<option>Sehlabathebe</option>
</select>

<button type="submit" class="btn btn-success">Submit Booking</button>
<div id="bookingMessage" class="mt-3"></div>
</form>
</div>

<div class="col-lg-6">
<h2 class="h4">Contact Form</h2>
<form onsubmit="return validateContact()">
<label class="form-label">Name *</label>
<input id="contactName" type="text" class="form-control mb-3" required>

<label class="form-label">Email *</label>
<input id="contactEmail" type="email" class="form-control mb-3" required>

<label class="form-label">Subject</label>
<input type="text" class="form-control mb-3">

<label class="form-label">Message *</label>
<textarea id="contactMessage" class="form-control mb-3" rows="5" required></textarea>

<button type="submit" class="btn btn-success">Send Message</button>
<div id="contactResult" class="mt-3"></div>
</form>
</div>
</div>
</section>

</main>

<footer class="mt-5 py-4">
<div class="container text-center">

<p class="mb-0">Explore the Mountain Kingdom of Lesotho.</p>
</div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
